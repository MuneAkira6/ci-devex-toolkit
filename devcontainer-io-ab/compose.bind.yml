# Arm A — everything on the bind mount.
#
# node_modules, dist, the pnpm store and the metadata cache all live inside the bind-mounted
# project directory. This is the layout a devcontainer has by default, and the one the practice
# moved away from.
#
# The only difference from compose.volume.yml is the volumes block (and the project name).
name: ci-devex-ioab-bind

# No proxy either: with network_mode none it could not be used, and some Docker installations add
# the machine's proxy settings (credentials included) to every container unless told otherwise.
x-no-proxy: &no-proxy
  HTTP_PROXY: ''
  HTTPS_PROXY: ''
  NO_PROXY: ''
  http_proxy: ''
  https_proxy: ''
  no_proxy: ''

services:
  app:
    image: ci-devex-ioab:local
    # No container of this run reaches the network (goal-pack/facts.md, F7).
    network_mode: none
    working_dir: /w
    init: true
    command: ['sleep', 'infinity']
    environment:
      <<: *no-proxy
      CI: 'true'
      IOAB_STORE: /w/.store
      IOAB_CACHE: /w/.cache
    volumes:
      - ./sample:/w
