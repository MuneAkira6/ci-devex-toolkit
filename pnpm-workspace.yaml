# The root is the toolkit; the one member is the pnpm sample that oss-inventory reads live.
# devcontainer-io-ab/sample is NOT a member: it is the measured project and has its own lockfile.
packages:
  - oss-inventory/samples/pnpm-app

# Supply-chain settings (pnpm 11; allowBuilds replaces onlyBuiltDependencies from earlier versions).
minimumReleaseAge: 4320   # install only versions published at least three days ago (minutes)
strictDepBuilds: true     # a dependency that wants to run a build script fails the install instead of being skipped
allowBuilds: {}           # no dependency here needs one
